  name: Leasey Status
  introTitle: "Leasey API status"
  introMessage: "Live availability, response times and incident history of the Leasey API. Checked every 5 minutes."
  navbar:
    - title: Status
      href: /
    - title: API documentation
      href: https://www.leasey.ai/leasey-api-documentation/
