# Status page pública de Leasey (https://status.leasey.ai) con Upptime.
# Este archivo va en la raíz del repo silverhomes/status, creado desde la
# plantilla https://github.com/upptime/upptime. Pasos en README.md.
owner: silverhomes
repo: status

sites:
  - name: Leasey API (production)
    url: https://api.leasey.ai/v1/health
  - name: Leasey API sandbox
    url: https://sandbox.api.leasey.ai/v1/health

status-website:
